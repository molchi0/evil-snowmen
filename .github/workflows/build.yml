name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:   # кнопка «Run workflow» вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        id: build
        continue-on-error: true
        run: ./gradlew build --no-daemon

      # Если сборка упала: печатаем реальные имена классов Minecraft 26.2,
      # чтобы можно было поправить код по фактам, а не по догадкам.
      - name: Diagnostics (Minecraft API names)
        if: steps.build.outcome == 'failure'
        run: |
          set +e
          echo "=== candidate jars"
          JARS=$(find ~/.gradle -name '*.jar' -size +3M 2>/dev/null | grep -iE 'minecraft')
          echo "$JARS"
          for j in $JARS; do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/projectile/'; then
              echo
              echo "################ JAR WITH PROJECTILES: $j"
              echo "=== classes: projectile / Snowball / Throwable / ThrownItem / ItemSupplier"
              unzip -l "$j" | awk '{print $4}' | grep -E 'world/entity/projectile/|Snowball|Throwable|ThrownItem|ItemSupplier|SnowGolem|Snowman' | sort
              echo "=== EntityType fields with SNOW/GOLEM"
              javap -cp "$j" -p net.minecraft.world.entity.EntityType | grep -iE 'snow|golem'
              for c in $(unzip -l "$j" | awk '{print $4}' | grep -E '(ThrowableItemProjectile|/Snowball|/Projectile|/ThrowableProjectile)\.class$' | sed 's/\.class$//; s#/#.#g'); do
                echo
                echo "=== javap $c"
                javap -cp "$j" -p "$c"
              done
              for c in net.minecraft.server.level.ServerLevel net.minecraft.world.level.Level net.minecraft.world.entity.Entity net.minecraft.commands.Commands; do
                echo
                echo "=== javap $c (methods used by blizzard/spawner)"
                javap -cp "$j" -p "$c" | grep -E 'ClockTime|getDayTime|canSeeSky|getHeight\(|noCollision|addFreshEntity|isThundering|getDifficulty|setPos\(|setYRot|snapTo|hasPermission|LEVEL_GAMEMASTERS'
              done
              for c in net.minecraft.world.entity.monster.Monster net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal; do
                echo
                echo "=== javap $c (constructors/key methods)"
                javap -cp "$j" -p "$c" | grep -E 'NearestAttackableTargetGoal\(|hurtServer|checkAnyLightMonsterSpawnRules|createMonsterAttributes'
              done
              break
            fi
          done

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: evil-snowmen-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
